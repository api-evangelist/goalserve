description: >-
  FinOps view of GoalServe spend. GoalServe bills via fixed-fee subscription
  packages (per sport or all-sports Full Package) on monthly, half-yearly or
  yearly terms, with optional in-play add-ons, rather than usage-metered
  per-request pricing. Cost is therefore largely a recurring committed
  subscription line item; the primary FinOps levers are right-sizing the set of
  sports and feed types subscribed and choosing the billing term. Exact list
  prices are sales-led and not reconciled here.
notes: >-
  GoalServe does not publish usage-based per-call rates; spend is driven by
  which sport packages, feed types and contract term are purchased. Verify
  current package pricing with GoalServe sales during reconciliation.
