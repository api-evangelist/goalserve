meters:
- name: sport_subscription
  description: Recurring subscription fee for a single sport's feed package.
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - sport
  - term
- name: full_package_subscription
  description: Recurring subscription fee for the all-sports Full Package.
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - term
- name: inplay_subscription
  description: Recurring add-on fee for low-latency in-play odds and stats feeds.
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - term
principles:
- name: Visibility
  description: Track active sport packages, feed types and contract renewal dates per account.
- name: Allocation
  description: Map each sport/feed subscription to the product or team that consumes it.
- name: Optimization
  description: Right-size subscriptions to only the sports and feed types in use; prefer longer billing terms (half-yearly/yearly) where committed usage justifies the discount.
- name: Accountability
  description: Assign an owner per subscription and review renewals against actual feed usage.
