aid: goalserve
url: https://raw.githubusercontent.com/api-evangelist/goalserve/refs/heads/main/apis.yml
name: GoalServe
kind: company
description: GoalServe is a live sports data feeds provider founded in 2005, delivering
  live scores, fixtures, standings, odds, commentaries, and team/player data across
  20+ sports and 500+ soccer leagues. Feeds are served as XML or JSON over HTTP GET
  with a unique API access key carried in the request path.
